# Builds docs/wiki with MkDocs (strict: broken links and anchors fail the build).
# Pull requests only build; pushes to main also deploy to GitHub Pages.
name: Wiki site

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', 'mkdocs.yml', '.github/workflows/wiki-pages.yml']
  pull_request:
    paths: ['docs/wiki/**', 'mkdocs.yml', '.github/workflows/wiki-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-pages-${{ github.ref }}
  # Don't cancel a deployment halfway (GitHub's Pages template does the same).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material==9.5.39
      - run: mkdocs build --strict --site-dir _site
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only main deploys, also for a manual run started from another branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
