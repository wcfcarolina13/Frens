name: Build Jar

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      - name: Locate distributable jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" | grep -Ev '(-sources|-dev|-shadow)' | sort | head -n 1 || true)
          if [[ -z "${JAR_PATH}" ]]; then
            echo "No distributable jar found in build/libs"
            exit 1
          fi
          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "${JAR_PATH}")" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.jar_name }}
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
