plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
	maven { url 'https://maven.wispforest.io/releases/' }
	flatDir {
		dirs "./lib"
	}
}

fabricApi {
	configureDataGeneration()
}

loom {
	runs {
		client {
			ideConfigGenerated true
			runDir "run"
		}
	}
}

dependencies {
	// Core Minecraft/Fabric
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Core application dependencies (Jackson: soul profiles and LLM JSON)
	implementation 'com.github.FasterXML:jackson-core:jackson-core-2.17.2'
	implementation 'com.github.FasterXML:jackson-databind:jackson-databind-2.17.2'
	implementation 'com.github.FasterXML:jackson-datatype-jsr310:jackson-datatype-jsr310-2.8.4'
	implementation 'com.github.FasterXML:jackson-annotations:jackson-annotations-2.17.2'

	// Include statements for runtime packaging.
	include "com.github.FasterXML:jackson-databind:jackson-databind-2.17.2"
	include "com.github.FasterXML:jackson-core:jackson-core-2.17.2"
	include "com.github.FasterXML:jackson-datatype-jsr310:jackson-datatype-jsr310-2.8.4"
	include "com.github.FasterXML:jackson-annotations:jackson-annotations-2.17.2"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testImplementation 'org.mockito:mockito-inline:5.2.0'
}

shadowJar {
	dependencies {
		include(dependency('com.fasterxml.jackson.core:jackson-databind'))
		include(dependency("io.wispforest:owo-sentinel:0.12.6+1.20.3"))
	}
	// Exclude compile-time shim packages that mirror runtime packages (do NOT ship these)
	// These stubs exist only to allow compilation against differing mappings and
	// must not be included in the mod JAR as they would conflict with game classes.
	exclude 'net/minecraft/**'
	relocate 'com.fasterxml.jackson', 'net.wcfcarolina13.relocated.com.fasterxml.jackson'
	relocate 'io.wispforest:owo-sentinel', 'net.wcfcarolina13.relocated.io.wispforest:owo-sentinel'
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	// Minecraft is strict about the schema of assets/*/sounds.json.
	// The project-level sounds.json includes a non-vanilla "category" field for readability,
	// but vanilla's loader will reject it (and then ALL custom sounds become "missing").
	// Strip those lines at build-time so the packaged JAR contains a valid sounds.json.
	filesMatching("assets/frens/sounds.json") {
		filter { String line ->
			line.contains('"category"') ? "" : line
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from(sourceSets.main.output)
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// Prevent shipping compile-time stubs that shadow runtime packages
	exclude 'net/minecraft/**'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}

// Minimal JVM configuration - no complex XML parsing needed
tasks.withType(JavaExec).configureEach {
	if (name.contains("run")) {
		// Basic module access for Java 17+
		jvmArgs += "--add-opens=java.base/java.lang=ALL-UNNAMED"
		jvmArgs += "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED"

		// Performance
		jvmArgs += "-Xmx4G"
		jvmArgs += "-Xms2G"
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// mockito-inline's bundled Byte Buddy predates official Java 21 (class file version 65)
	// support; this is the exact workaround Byte Buddy's own exception message names. Set once
	// here for the whole Test task rather than per-test-class, since class-load order across a
	// shared, unordered test JVM would otherwise decide which test "wins" the flag.
	systemProperty 'net.bytebuddy.experimental', 'true'
}
